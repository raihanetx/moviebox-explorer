name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin file-size policy
        run: scripts/check-file-size.sh

      - name: Unit tests and debug APK
        run: ./gradlew :core:test :app:assembleDebug

      # Free GitHub VMs have no KVM — the emulator runs with -accel off and never
      # finishes booting, and the geo-blocked runner can't reach the backends anyway.
      # Diagnostics still run on demand via Actions > Android CI > Run workflow.
      - name: Emulator diagnostics
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save
          emulator-boot-timeout: 900
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            adb shell run-as com.example.movieboxexplorer cat files/diagnostics_report.txt > diagnostics_report.txt || true
            adb logcat -d -s DiagnosticsTest:I > logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: diagnostics
          path: |
            diagnostics_report.txt
            logcat.txt
            app/build/reports/androidTests/connected/**