name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin file-size policy
        run: scripts/check-file-size.sh

      - name: Unit tests and debug APK
        run: gradle :core:test :app:assembleDebug

      - name: Emulator diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest
            adb shell run-as com.example.movieboxexplorer cat files/diagnostics_report.txt > diagnostics_report.txt || true
            adb logcat -d -s DiagnosticsTest:I > logcat.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            diagnostics_report.txt
            logcat.txt
            app/build/reports/androidTests/connected/**